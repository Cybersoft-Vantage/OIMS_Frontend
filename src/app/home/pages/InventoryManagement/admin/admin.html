<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">
    <div>
      <h5 class="mb-0">Inventory Admin</h5>
      <p class="text-muted mb-0">Administrative controls for inventory module settings.</p>
    </div>
  </div>
  <div class="card-body">
    <div class="row g-3">
      <div class="col-md-4" *ngFor="let section of sections">
        <div class="card shadow-sm border-0">
          <div class="card-body">
            <h6>{{ section.title }}</h6>
            <p class="mb-0 text-muted">{{ section.description }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
