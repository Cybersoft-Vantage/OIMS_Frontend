<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">
    <div>
      <h5 class="mb-0">Alerts</h5>
      <p class="text-muted mb-0">System alerts and notifications for inventory events.</p>
    </div>
  </div>
  <div class="card-body">
    <div class="list-group">
      <button *ngFor="let notification of notifications" type="button" class="list-group-item list-group-item-action">
        <div class="d-flex w-100 justify-content-between">
          <h6 class="mb-1">{{ notification.level }}</h6>
          <small>{{ notification.date }}</small>
        </div>
        <p class="mb-1">{{ notification.message }}</p>
      </button>
    </div>
  </div>
</div>
