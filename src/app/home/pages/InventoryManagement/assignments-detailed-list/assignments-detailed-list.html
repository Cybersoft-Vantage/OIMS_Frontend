<div class="assignments-multi-card row gx-4">
  <div class="col-xl-7">
    <div class="card h-100">
      <div class="card-header">
        <div class="header-intro mb-2">
          <h5 class="mb-1">Available Assets (In Stock)</h5>
          <small class="text-muted">Select one or more assets to assign.</small>
        </div>
        <div class="search-controls d-flex gap-2">
          <input class="form-control form-control-sm" placeholder="Search tag / name..." [(ngModel)]="search" />
          <select class="form-select form-select-sm" [(ngModel)]="categoryFilter">
            <option [ngValue]="undefined">Category</option>
            <option *ngFor="let category of categories" [ngValue]="category.DetailedCategoryId">{{ category.Name }}</option>
          </select>
        </div>
      </div>
      <div class="card-body px-0 py-2">
        <div class="list-group list-group-flush">
          <button type="button" class="list-group-item list-group-item-action d-flex align-items-center justify-content-between"
            *ngFor="let asset of pagedAssets" [class.active]="isSelected(asset)" [class.disabled]="isBlockedForAssignment(asset)" [class.sold-item]="isSold(asset)" (click)="toggleSelection(asset)">
            <div class="asset-meta">
              <div class="asset-meta-row">
                <div class="asset-title fw-semibold" title="{{ asset.AssetTag || '-' }} {{ asset.Name }}">{{ asset.AssetTag || '-' }} {{ asset.Name }}</div>
                <span *ngIf="isSelected(asset)" class="badge bg-primary selected-badge">Selected</span>
              </div>
              <small class="text-muted">{{ asset.MakeModel || 'No model' }}</small>
            </div>
            <div class="text-end">
              <span class="badge bg-light text-dark me-2">{{ getCategoryName(asset.DetailedCategoryId) }}</span>
              <span *ngIf="!isBlockedForAssignment(asset)" class="badge" [ngClass]="assetHasOpenAssignment(asset) ? 'bg-secondary' : 'bg-outline-primary'">{{ assetHasOpenAssignment(asset) ? 'Assigned' : 'Available' }}</span>
              <span *ngIf="isUnderMaintenance(asset)" class="badge bg-danger">{{ asset.Status || 'Maintenance' }}</span>
              <span *ngIf="isSold(asset)" class="badge bg-dark">Sold</span>
            </div>
          </button>
          <div *ngIf="!filteredAssets.length" class="list-group-item text-center text-muted">No assets found.</div>
        </div>
      </div>
      <div class="card-footer d-flex justify-content-between align-items-center">
        <div class="text-muted">Showing {{ filteredAssets.length }} items</div>
        <nav>
          <ul class="pagination pagination-sm mb-0">
            <li class="page-item" [class.disabled]="page === 1"><a class="page-link" (click)="prevPage()">Prev</a></li>
            <li class="page-item" *ngFor="let idx of [].constructor(totalPages); let i = index" [class.active]="page === i + 1"><a class="page-link" (click)="gotoPage(i + 1)">{{ i + 1 }}</a></li>
            <li class="page-item" [class.disabled]="page === totalPages"><a class="page-link" (click)="nextPage()">Next</a></li>
          </ul>
        </nav>
      </div>
    </div>
  </div>

  <div class="col-xl-5">
    <div class="card h-100">
      <div class="card-header">
        <h5 class="mb-1">Assignment</h5>
        <small class="text-muted">Selected assets ({{ selectedAssetList.length }})</small>
      </div>
      <div class="card-body">
        <div *ngIf="selectedAssetList.length; else noSelection">
          <ul class="list-group mb-3">
            <li class="list-group-item py-2 d-flex align-items-center justify-content-between" *ngFor="let selected of selectedAssetList">
              <div>
                <div class="fw-semibold">{{ selected.AssetTag || '-' }}</div>
                <div>{{ selected.Name }}</div>
              </div>
              <button type="button" class="btn btn-sm btn-outline-danger btn-icon" (click)="toggleSelection(selected)">×</button>
            </li>
          </ul>
        </div>
        <ng-template #noSelection>
          <div class="text-center text-muted py-4">No assets selected.</div>
        </ng-template>

        <div class="mb-3">
          <label class="form-label">Employee</label>
          <select class="form-select" [(ngModel)]="selectedEmployeeId" name="selectedEmployeeId">
            <option [ngValue]="undefined" disabled>Select employee</option>
            <option *ngFor="let employee of employees" [ngValue]="employee.EmployeeId">{{ employee.FullName }}</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Issue Date</label>
          <input type="date" class="form-control" [(ngModel)]="assignedDate" name="assignedDate" />
        </div>
        <div class="mb-3">
          <label class="form-label">Condition</label>
          <select class="form-select" [(ngModel)]="condition" name="condition">
            <option>Good</option>
            <option>Fair</option>
            <option>Poor</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Notes</label>
          <textarea class="form-control" rows="3" [(ngModel)]="notes" name="notes"></textarea>
        </div>
        <div class="form-check form-switch mb-3">
          <input class="form-check-input" type="checkbox" [(ngModel)]="acknowledge" name="acknowledge" id="acknowledgeToggle" />
          <label class="form-check-label" for="acknowledgeToggle">Require employee acknowledgement</label>
        </div>
      </div>
      <div class="card-footer text-end">
        <button type="button" class="btn btn-primary" (click)="submitAssignments()" [disabled]="!selectedAssetList.length || !selectedEmployeeId || isSubmitting">
          <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
          {{ isSubmitting ? 'Assigning...' : ('Assign (' + selectedAssetList.length + ')') }}
        </button>
      </div>
    </div>
  </div>
</div>
