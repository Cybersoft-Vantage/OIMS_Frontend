<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">
    <div>
      <h5 class="mb-0">Consumables</h5>
      <p class="text-muted mb-0">Monitor stocks and reorder thresholds.</p>
    </div>
  </div>
  <div class="card-body table-scroll-x">
    <table class="table table-hover align-middle table-nowrap">
      <thead>
        <tr>
          <th>#</th>
          <th>Item</th>
          <th>Stock</th>
          <th>Reorder Threshold</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of items; let i = index">
          <td>{{ i + 1 }}</td>
          <td>{{ item.name }}</td>
          <td>{{ item.stock }}</td>
          <td>{{ item.threshold }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
